services:
  - type: web
    name: botdj
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/estado
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: LLM_API_KEY
        sync: false
      - key: CANALES_JSON
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
